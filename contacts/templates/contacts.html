{% extends 'base.html' %}

{% block content %}


<div class="flex flex-col gap-2">

  <div>
    <h1 class="text-4xl text-success mb-4">Contact Manager</h1>
  </div>


  <div>
    <form method="post" class="mb-4">
      {% csrf_token %}
      
      <div class="form-control w-full">
        <label class="label">
          <span class="label-text">Name</span>
        </label>

        {{from.name}}

        {% if form.name.errors %}
          <label class="label text-error">
            {{form.name.errors}}
          </label>
        {% endif %}
      </div>

      <div class="form-control w-full">
        <label class="label">
          <span class="label-text">Email</span>
        </label>

        {{from.email}}

        {% if form..erremailors %}
          <label class="label text-error">
            {{form.email.errors}}
          </label>
        {% endif %}
      </div>

      <div class="mt-4">
        <button type="submit" class="btn btn-primary">Add Contact</button>
      </div>

    </form>
  </div>

  <div>
    <label class="input flex items-center gap-2">
      {% include 'partials/spinner.html'%}
    <svg
      class="h-5 w-5 opacity-50 shrink-0"
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
    >
      <g
        stroke-linejoin="round"
        stroke-linecap="round"
        stroke-width="2.5"
        fill="none"
        stroke="currentColor"
      >
        <circle cx="11" cy="11" r="8"></circle>
        <path d="m21 21-4.3-4.3"></path>
      </g>
    </svg>

    


    <input
      type="search"
      required
      placeholder="Search"
      class="grow"
      name="search"
      hx-get="{% url 'search' %}"
      hx-trigger="keyup delay:500ms"
      hx-target="#contacts-list"
      hx-indicator="#spinner"
      hx-on::before-request="document.getElementById('contacts-list').style.opacity = 0.4"
      hx-on::after-request="document.getElementById('contacts-list').style.opacity = 1.0"
    />
  </label>
  </div>


  <div>
    {% include 'partials/contacts-list.html'%}
  </div>


</div>


{% endblock %}
